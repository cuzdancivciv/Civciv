<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#c8890a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Civciv">
<link rel="manifest" href="manifest.json">
<title>Civciv Cüzdan</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f7f5f0;max-width:430px;margin:0 auto;display:flex;flex-direction:column;height:100%;position:relative;}
body.dark{background:#111;}
input,textarea,select{-webkit-user-select:auto;user-select:auto;}

/* TOPBAR */
#topbar{background:#fff;border-bottom:1px solid #e2ddd2;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:40;}
.dark #topbar{background:#1c1c1c;border-color:#2c2c2c;}
#logo-wrap{display:flex;align-items:center;gap:8px;}
#logo-info{display:flex;flex-direction:column;justify-content:center;}
#logo-text{font-weight:800;font-size:19px;color:#c8890a;line-height:1;}
.dark #logo-text{color:#FFD93D;}
#top-name{font-size:11px;color:#9a9a9a;font-weight:600;margin-top:1px;}
#top-meta{font-size:10px;color:#b0a898;margin-top:1px;}

/* BAL STRIP - üstte TL/USD/EUR renkli bloklar */
#balstrip{display:flex;gap:6px;padding:8px 14px;flex-shrink:0;background:#fff;border-bottom:1px solid #e2ddd2;}
.dark #balstrip{background:#1c1c1c;border-color:#2c2c2c;}
.bsl{flex:1;border-radius:10px;padding:7px 6px;text-align:center;}
.bsl-lbl{font-size:9px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.5px;}
.bsl-val{font-size:13px;font-weight:800;color:#fff;margin-top:2px;}

/* QUICK BTNS - sadece home'da */
#qbar{background:#fff;border-bottom:1px solid #e2ddd2;padding:8px 14px;display:flex;gap:7px;flex-shrink:0;}
.dark #qbar{background:#1c1c1c;border-color:#2c2c2c;}
.qb{flex:1;padding:10px 0;border-radius:12px;border:none;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;}

/* CONTENT */
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.view{display:none;padding-bottom:10px;}
.view.on{display:block;}

/* CARDS */
.card{background:#fff;border-radius:16px;margin:10px 14px;padding:13px;border:1px solid #e2ddd2;}
.dark .card{background:#1c1c1c;border-color:#2c2c2c;}
.ctitle{font-size:10px;font-weight:700;color:#9a9a9a;text-transform:uppercase;letter-spacing:.8px;margin-bottom:9px;}

/* TX */
.txi{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e2ddd2;}
.dark .txi{border-color:#2c2c2c;}
.txi:last-child{border-bottom:none;}
.txd{font-size:13px;font-weight:600;color:#1a1a1a;}
.dark .txd{color:#f0f0f0;}
.txm{font-size:10px;color:#9a9a9a;margin-top:1px;}
.txa{font-size:14px;font-weight:800;}
.inc{color:#16a34a;}.exp{color:#dc2626;}
.dark .inc{color:#22c55e;}.dark .exp{color:#ef4444;}

/* SCROLL */
#scroll-wrap{margin-top:9px;}
#scroll-row{display:flex;gap:9px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
#scroll-row::-webkit-scrollbar{display:none;}
.sc{min-width:130px;background:#f0ede6;border-radius:13px;padding:11px;border:1px solid #e2ddd2;flex-shrink:0;}
.dark .sc{background:#222;border-color:#2c2c2c;}
.sca{font-size:13px;font-weight:800;margin-bottom:3px;}
.scd{font-size:11px;font-weight:600;color:#1a1a1a;margin-bottom:1px;}
.dark .scd{color:#f0f0f0;}
.scm{font-size:10px;color:#9a9a9a;}

/* NOTES HOME */
#notes-home{display:none;}
.nhi{padding:8px 0;border-bottom:1px solid #e2ddd2;cursor:pointer;}
.dark .nhi{border-color:#2c2c2c;}
.nhi:last-child{border-bottom:none;}
.nht{font-size:13px;font-weight:700;color:#1a1a1a;}.dark .nht{color:#f0f0f0;}
.nhb{font-size:11px;color:#9a9a9a;margin-top:2px;}
.nhr{font-size:10px;font-weight:700;color:#c8890a;margin-top:3px;}.dark .nhr{color:#FFD93D;}

/* REPORTS */
#view-reports{padding:10px 14px;}
.rtabs{display:flex;gap:5px;margin-bottom:13px;}
.rtab{flex:1;padding:8px 0;border-radius:10px;border:none;background:#f0ede6;color:#9a9a9a;font-weight:700;font-size:11px;cursor:pointer;font-family:inherit;}
.dark .rtab{background:#222;}
.rtab.on{background:#c8890a;color:#fff;}
.dark .rtab.on{background:#FFD93D;color:#111;}
.rc{background:#fff;border-radius:14px;padding:14px 16px;border:1px solid #e2ddd2;display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
.dark .rc{background:#1c1c1c;border-color:#2c2c2c;}
.rl{font-size:13px;color:#9a9a9a;font-weight:600;}
.rv{font-size:21px;font-weight:800;}
.bars{display:flex;gap:20px;align-items:flex-end;height:65px;margin-top:10px;}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.bnum{font-size:10px;color:#9a9a9a;font-weight:600;}
.brect{width:100%;border-radius:6px;min-height:4px;}
.blbl{font-size:10px;color:#9a9a9a;}

/* NOTES FULL */
#view-notes{padding:10px 14px;}
#nadd{width:100%;padding:12px;border-radius:13px;border:none;font-weight:700;font-size:14px;cursor:pointer;margin-bottom:4px;font-family:inherit;background:#c8890a;color:#fff;}
.dark #nadd{background:#FFD93D;color:#111;}
.nfi{padding:9px 0;border-bottom:1px solid #e2ddd2;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;}
.dark .nfi{border-color:#2c2c2c;}
.nft{font-size:13px;font-weight:700;color:#1a1a1a;}.dark .nft{color:#f0f0f0;}
.nfb{font-size:11px;color:#9a9a9a;margin-top:2px;}
.nfr{font-size:10px;font-weight:700;color:#c8890a;margin-top:3px;}.dark .nfr{color:#FFD93D;}
.ndel{background:none;border:none;cursor:pointer;color:#9a9a9a;font-size:18px;padding:0;flex-shrink:0;margin-left:8px;}

/* PROFILE */
#view-profile{padding:10px 14px 100px;}
.ps{background:#fff;border-radius:14px;margin-bottom:9px;padding:13px;border:1px solid #e2ddd2;}
.dark .ps{background:#1c1c1c;border-color:#2c2c2c;}
.pst{font-size:10px;font-weight:700;color:#9a9a9a;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;}
.pr{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e2ddd2;font-size:13px;}
.dark .pr{border-color:#2c2c2c;}
.prl{color:#9a9a9a;}.prv{font-weight:600;color:#1a1a1a;}.dark .prv{color:#f0f0f0;}
.avw{width:72px;height:72px;border-radius:50%;border:3px solid #c8890a;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fffaeb;font-size:28px;flex-shrink:0;}
.dark .avw{border-color:#FFD93D;background:#201c00;}
#av-img{width:100%;height:100%;object-fit:cover;display:none;}
.pb{width:100%;padding:12px 13px;border-radius:11px;border:1.5px solid #e2ddd2;background:#f5f5f2;color:#1a1a1a;font-weight:600;font-size:13px;cursor:pointer;text-align:left;font-family:inherit;margin-bottom:0;}
.dark .pb{background:#252525;border-color:#333;color:#f0f0f0;}

/* BOTTOM BAR */
#bbar{background:#fff;border-top:1px solid #e2ddd2;display:flex;padding:7px 0 20px;flex-shrink:0;}
.dark #bbar{background:#1c1c1c;border-color:#2c2c2c;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;cursor:pointer;font-size:10px;font-weight:500;color:#9a9a9a;padding:3px 0;font-family:inherit;}
.nb.on{color:#c8890a;font-weight:700;}.dark .nb.on{color:#FFD93D;}
.ni{font-size:21px;line-height:1;}

/* OVERLAY */
#ov{position:fixed;inset:0;background:#0009;z-index:200;display:none;align-items:flex-end;justify-content:center;}
#ov.on{display:flex;}
#sh{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 36px;width:100%;max-width:430px;max-height:88vh;overflow-y:auto;}
.dark #sh{background:#1c1c1c;}
.sht{font-size:17px;font-weight:800;color:#1a1a1a;margin-bottom:15px;}.dark .sht{color:#f0f0f0;}
.fl{font-size:11px;font-weight:600;color:#9a9a9a;display:block;margin-bottom:3px;}
.fi{width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid #ddd8cc;background:#f5f5f2;color:#1a1a1a;font-size:14px;outline:none;margin-bottom:9px;font-family:inherit;}
.dark .fi{background:#252525;border-color:#333;color:#f0f0f0;}
textarea.fi{min-height:85px;resize:vertical;}
.fb{width:100%;padding:13px;border-radius:13px;border:none;font-weight:700;font-size:14px;cursor:pointer;margin-top:5px;font-family:inherit;}
.fc{background:transparent;color:#9a9a9a;}
#cprev{background:#fffaeb;border-radius:11px;padding:13px;text-align:center;margin-bottom:9px;display:none;}
.dark #cprev{background:#201c00;}
#cpv{font-size:22px;font-weight:800;color:#1d6fa4;margin-top:3px;}.dark #cpv{color:#60a5fa;}

/* PIN */
#pin-screen{position:fixed;inset:0;background:#f7f5f0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;}
.dark #pin-screen{background:#111;}
#pdots{display:flex;gap:14px;margin-bottom:8px;}
.pd{width:14px;height:14px;border-radius:50%;background:#e2ddd2;transition:background .12s;}
.pd.on{background:#c8890a;}.dark .pd.on{background:#FFD93D;}
.pd.err{background:#dc2626!important;}
#pgrid{display:grid;grid-template-columns:repeat(3,68px);gap:9px;margin-top:14px;}
.pk{width:68px;height:68px;border-radius:17px;border:none;font-size:21px;font-weight:700;cursor:pointer;background:#ece9e1;color:#1a1a1a;font-family:inherit;}
.dark .pk{background:#252525;color:#f0f0f0;}
.pk.emp{background:transparent!important;cursor:default;}

/* TOAST */
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:16px;font-weight:700;font-size:13px;z-index:1000;white-space:nowrap;color:#fff;display:none;box-shadow:0 4px 16px rgba(0,0,0,.25);}

/* TX EDIT */
.tx-edit-btn{background:none;border:none;cursor:pointer;font-size:13px;padding:2px 6px;color:#9a9a9a;border-radius:6px;}
</style>
</head>
<body>

<!-- PIN -->
<div id="pin-screen">
  <svg width="50" height="50" viewBox="0 0 64 64" fill="none">
    <ellipse cx="32" cy="40" rx="20" ry="16" fill="#FFD93D"/>
    <ellipse cx="32" cy="24" rx="14" ry="13" fill="#FFD93D"/>
    <ellipse cx="26" cy="21" rx="3" ry="3.5" fill="white"/>
    <ellipse cx="38" cy="21" rx="3" ry="3.5" fill="white"/>
    <circle cx="26.5" cy="21.5" r="1.5" fill="#111"/>
    <circle cx="38.5" cy="21.5" r="1.5" fill="#111"/>
    <ellipse cx="32" cy="29" rx="4" ry="2.5" fill="#FF9F43"/>
    <path d="M29 28.5 Q32 32 35 28.5" stroke="#FF9F43" stroke-width="1.5" fill="#FF9F43"/>
    <ellipse cx="14" cy="36" rx="7" ry="5" fill="#FFD93D" transform="rotate(-20 14 36)"/>
    <ellipse cx="50" cy="36" rx="7" ry="5" fill="#FFD93D" transform="rotate(20 50 36)"/>
  </svg>
  <div id="pname" style="font-size:26px;font-weight:800;color:#c8890a;margin-top:10px;">Civciv</div>
  <div style="font-size:13px;color:#9a9a9a;margin-top:4px;margin-bottom:26px;">PIN'inizi girin</div>
  <div id="pdots"><div class="pd" id="d0"></div><div class="pd" id="d1"></div><div class="pd" id="d2"></div><div class="pd" id="d3"></div></div>
  <div id="perr" style="height:22px;font-size:13px;font-weight:700;color:#dc2626;text-align:center;margin-top:4px;"></div>
  <div id="pgrid">
    <button class="pk" onclick="pt('1')">1</button><button class="pk" onclick="pt('2')">2</button><button class="pk" onclick="pt('3')">3</button>
    <button class="pk" onclick="pt('4')">4</button><button class="pk" onclick="pt('5')">5</button><button class="pk" onclick="pt('6')">6</button>
    <button class="pk" onclick="pt('7')">7</button><button class="pk" onclick="pt('8')">8</button><button class="pk" onclick="pt('9')">9</button>
    <button class="pk emp"></button><button class="pk" onclick="pt('0')">0</button><button class="pk" onclick="pd()">⌫</button>
  </div>
</div>

<!-- TOPBAR -->
<div id="topbar">
  <div id="logo-wrap">
    <svg width="34" height="34" viewBox="0 0 64 64" fill="none">
      <ellipse cx="32" cy="40" rx="20" ry="16" fill="#FFD93D"/>
      <ellipse cx="32" cy="24" rx="14" ry="13" fill="#FFD93D"/>
      <ellipse cx="26" cy="21" rx="3" ry="3.5" fill="white"/>
      <ellipse cx="38" cy="21" rx="3" ry="3.5" fill="white"/>
      <circle cx="26.5" cy="21.5" r="1.5" fill="#111"/>
      <circle cx="38.5" cy="21.5" r="1.5" fill="#111"/>
      <ellipse cx="32" cy="29" rx="4" ry="2.5" fill="#FF9F43"/>
      <path d="M29 28.5 Q32 32 35 28.5" stroke="#FF9F43" stroke-width="1.5" fill="#FF9F43"/>
      <ellipse cx="14" cy="36" rx="7" ry="5" fill="#FFD93D" transform="rotate(-20 14 36)"/>
      <ellipse cx="50" cy="36" rx="7" ry="5" fill="#FFD93D" transform="rotate(20 50 36)"/>
    </svg>
    <div id="logo-info">
      <span id="logo-text">Civciv</span>
      <span id="top-name"></span>
      <span id="top-meta"></span>
    </div>
  </div>
  <button onclick="td()" style="background:none;border:none;cursor:pointer;font-size:20px;padding:4px;" id="theme-icon">🌙</button>
</div>

<!-- BAL STRIP - tüm sayfalarda görünür -->
<div id="balstrip">
  <div class="bsl" style="background:#dc2626;">
    <div class="bsl-lbl">TL</div>
    <div class="bsl-val" id="bs-try">₺0</div>
  </div>
  <div class="bsl" style="background:#16a34a;">
    <div class="bsl-lbl">USD</div>
    <div class="bsl-val" id="bs-usd">$0</div>
  </div>
  <div class="bsl" style="background:#1d6fa4;">
    <div class="bsl-lbl">EUR</div>
    <div class="bsl-val" id="bs-eur">€0</div>
  </div>
</div>

<!-- QUICK BTNS - sadece home'da -->
<div id="qbar" style="display:none;">
  <button class="qb" style="background:#dc2626;color:#fff;" onclick="om('inc')">+ Gelir Ekle</button>
  <button class="qb" style="background:#16a34a;color:#fff;" onclick="om('exp')">− Gider Ekle</button>
  <button class="qb" style="background:#1d6fa4;color:#fff;" onclick="om('conv')">⇄ Dönüştür</button>
</div>

<!-- CONTENT -->
<div id="content">

  <!-- HOME -->
  <div class="view on" id="view-home">
    <div class="card" style="padding:13px 13px 8px;">
      <div class="ctitle">Son İşlemler</div>
      <div id="tx5"></div>
      <div id="scroll-wrap" style="display:none;">
        <div class="ctitle" style="margin-top:8px;">Diğer İşlemler</div>
        <div id="scroll-row"></div>
      </div>
    </div>
    <div class="card" id="notes-home" style="display:none;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;">
        <div class="ctitle" style="margin-bottom:0;">📝 Notlar</div>
        <button onclick="sv('notes')" style="font-size:11px;font-weight:700;color:#c8890a;background:none;border:none;cursor:pointer;">Tümü →</button>
      </div>
      <div id="nhl"></div>
    </div>
  </div>

  <!-- REPORTS -->
  <div class="view" id="view-reports">
    <div class="rtabs">
      <button class="rtab on" onclick="srt('daily',this)">Günlük</button>
      <button class="rtab" onclick="srt('weekly',this)">Haftalık</button>
      <button class="rtab" onclick="srt('monthly',this)">Aylık</button>
      <button class="rtab" onclick="srt('yearly',this)">Yıllık</button>
    </div>
    <div class="rc"><span class="rl">TRY Gelir</span><span class="rv inc" id="ri-try">₺0</span></div>
    <div class="rc"><span class="rl">TRY Gider</span><span class="rv exp" id="re-try">₺0</span></div>
    <div class="rc"><span class="rl">TRY Net</span><span class="rv" id="rn-try">₺0</span></div>
    <div class="rc"><span class="rl">USD Net</span><span class="rv" id="rn-usd" style="color:#16a34a;">$0</span></div>
    <div class="rc"><span class="rl">EUR Net</span><span class="rv" id="rn-eur" style="color:#1d6fa4;">€0</span></div>
    <div class="rc" style="flex-direction:column;align-items:stretch;">
      <div class="ctitle">TRY Gelir / Gider</div>
      <div class="bars">
        <div class="bcol"><div class="bnum" id="bn1">₺0</div><div class="brect" id="br1" style="height:4px;background:#16a34a;"></div><div class="blbl">Gelir</div></div>
        <div class="bcol"><div class="bnum" id="bn2">₺0</div><div class="brect" id="br2" style="height:4px;background:#dc2626;"></div><div class="blbl">Gider</div></div>
      </div>
    </div>
    <div class="rc"><span class="rl">Toplam İşlem</span><span class="rv" id="rc2" style="color:#c8890a;">0</span></div>
  </div>

  <!-- NOTES -->
  <div class="view" id="view-notes">
    <button id="nadd" onclick="om('addNote')">+ Yeni Not Ekle</button>
    <div id="nfl"><div style="color:#9a9a9a;text-align:center;margin-top:32px;font-size:13px;">Henüz not yok</div></div>
  </div>

  <!-- PROFILE -->
  <div class="view" id="view-profile">
    <!-- Profil kartı: fotoğraf sol, isim/mail sağ -->
    <div class="ps">
      <div style="display:flex;align-items:center;gap:14px;">
        <div class="avw" onclick="document.getElementById('avi').click()">
          <img id="av-img" src="" alt=""><span id="av-ph">🐥</span>
        </div>
        <input type="file" id="avi" accept="image/*" style="display:none" onchange="ha(this)">
        <div style="flex:1;min-width:0;">
          <div id="pnd" style="font-weight:800;font-size:17px;color:#1a1a1a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Ad Soyad</div>
          <div id="ped" style="font-size:12px;color:#9a9a9a;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></div>
          <div id="pph" style="font-size:12px;color:#9a9a9a;margin-top:2px;"></div>
          <button onclick="om('editProfile')" style="margin-top:8px;padding:6px 14px;border-radius:9px;border:1.5px solid #c8890a;background:transparent;color:#c8890a;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;">Profilimi Güncelle</button>
        </div>
      </div>
    </div>

    <div class="ps">
      <div class="pst">Güvenlik</div>
      <button class="pb" onclick="om('changePin')">🔒 PIN Değiştir</button>
    </div>

    <div class="ps">
      <div class="pst">Veri Yönetimi</div>
      <button class="pb" onclick="backupData()" style="margin-bottom:8px;">📦 Verileri Yedekle (JSON)</button>
      <button class="pb" onclick="document.getElementById('restore-input').click()" style="margin-bottom:8px;">📥 Yedekten Geri Yükle</button>
      <input type="file" id="restore-input" accept=".json" style="display:none;" onchange="restoreData(this)">
      <button class="pb" onclick="resetData()" style="background:#fff3cd;color:#856404;border-color:#ffc107;margin-bottom:8px;">🗑️ Tüm Verileri Sıfırla</button>
      <button class="pb" onclick="deleteAccount()" style="background:#fee2e2;color:#dc2626;border-color:#f5c6cb;">❌ Hesabı Tamamen Sil</button>
    </div>

    <div class="ps" style="margin-bottom:30px;">
      <button class="pb" onclick="lock()" style="background:#fee2e2;color:#dc2626;border-color:#fee2e2;margin-bottom:20px;">🔒 Kilitle / Çıkış</button>
    </div>
  </div>

</div>

<!-- BOTTOM BAR -->
<div id="bbar">
  <button class="nb on" id="nb0" onclick="sv('home')"><span class="ni">🏠</span>Ana Sayfa</button>
  <button class="nb" id="nb1" onclick="sv('notes')"><span class="ni">📝</span>Notlar</button>
  <button class="nb" id="nb2" onclick="sv('reports')"><span class="ni">📊</span>Raporlar</button>
  <button class="nb" id="nb3" onclick="sv('profile')"><span class="ni" id="nbpi">👤</span>Profil</button>
</div>

<!-- OVERLAY -->
<div id="ov" onclick="cm()">
  <div id="sh" onclick="event.stopPropagation()"><div id="sc"></div></div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
/* DATA */
var SK='cv7';

function sv2(){try{localStorage.setItem(SK,JSON.stringify(D));}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,9);}
function td2(){return new Date().toISOString().slice(0,10);}
function fm(n,d){if(d===undefined)d=2;return Number(n||0).toLocaleString('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d});}
var SM={TRY:'₺',USD:'$',EUR:'€',GBP:'£'};
function ex(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* DARK */
function ad(){
  var dk=D.dark;
  document.body.classList.toggle('dark',dk);
  document.getElementById('theme-icon').textContent=dk?'☀️':'🌙';
  document.getElementById('pname').style.color=dk?'#FFD93D':'#c8890a';
}
function td(){D.dark=!D.dark;sv2();ad();}

/* PIN */
var pb='';
function upd(){for(var i=0;i<4;i++){var d=document.getElementById('d'+i);d.classList.toggle('on',i<pb.length);d.classList.remove('err');}}
function pt(d){
  if(pb.length>=4)return;
  pb+=d;upd();
  if(pb.length===4){
    setTimeout(function(){
      if(pb===D.pin){document.getElementById('pin-screen').style.display='none';ra();}
      else{
        for(var i=0;i<4;i++)document.getElementById('d'+i).classList.add('err');
        document.getElementById('perr').textContent='Hatali PIN!';
        setTimeout(function(){pb='';upd();document.getElementById('perr').textContent='';},700);
      }
    },80);
  }
}
function pd(){pb=pb.slice(0,-1);upd();}
function lock(){pb='';upd();document.getElementById('perr').textContent='';document.getElementById('pin-screen').style.display='flex';}

    +'<select class="fi" id="e-cur">'

    +'<option value="USD"'+(t.cur==='USD'?' selected':'')+'>Dolar ($)</option>'
    +'<option value="EUR"'+(t.cur==='EUR'?' selected':'')+'>Euro (€)</option>'
    +'</select>'
    +'<label class="fl">Tutar</label>'
    +'<div style="display:flex;gap:8px;margin-bottom:9px;">'
    +'<input type="number" class="fi" id="e-amt" value="'+t.amt+'" style="flex:1;margin-bottom:0;">'
    +(t.tp==='exp'?'<button onclick="fillAllEdit(\''+id+'\')" style="padding:0 12px;border-radius:11px;border:none;background:'+(D.dark?'#333':'#e2ddd2')+';color:'+ac+';font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap;">Hepsi</button>':'')
    +'</div>'
    +'<label class="fl">Açıklama</label>'
    +'<input type="text" class="fi" id="e-dsc" value="'+ex(t.desc||'')+'">'
    +'<label class="fl">Tarih</label>'
    +'<input type="date" class="fi" id="e-dt" value="'+t.date+'">'
    +'<button class="fb" style="background:'+bg+';color:#fff;" onclick="saveTx(\''+id+'\')">Kaydet</button>'
    +'<button class="fb" style="background:#fee2e2;color:#dc2626;margin-top:6px;" onclick="delTx(\''+id+'\')">Sil</button>'
    +'<button class="fb fc" onclick="cm()">İptal</button>';

  document.getElementById('ov').classList.add('on');
}
function fillAllEdit(id){
  var t=D.txs.find(function(x){return x.id===id;});
  if(!t)return;
  var cur=document.getElementById('e-cur').value;
  var b=gb(cur);
  if(b>0)document.getElementById('e-amt').value=b.toFixed(2);
}
function saveTx(id){
  var idx=D.txs.findIndex(function(x){return x.id===id;});
  if(idx<0)return;
  var amt=parseFloat(document.getElementById('e-amt').value);
  if(!amt||amt<=0){toast('Gecerli tutar girin',true);return;}
  D.txs[idx].cur=document.getElementById('e-cur').value;
  D.txs[idx].amt=amt;
  D.txs[idx].desc=document.getElementById('e-dsc').value;
  D.txs[idx].date=document.getElementById('e-dt').value||td2();
  sv2();rb();rtx();rr();cm();
  toast('İşlem güncellendi');
}
function delTx(id){
  D.txs=D.txs.filter(function(x){return x.id!==id;});
  sv2();rb();rtx();rr();cm();
  toast('İşlem silindi');
}

/* TARIH SAAT VE HAVA DURUMU */
function topMeta(){
  var now=new Date();
  var tarih=now.toLocaleDateString('tr-TR',{day:'numeric',month:'long'});
  var saat=now.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
  var meta=tarih+' '+saat;
  document.getElementById('top-meta').textContent=meta;
  /* Hava durumu - konum al */
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(pos){
      var lat=pos.coords.latitude.toFixed(2);
      var lon=pos.coords.longitude.toFixed(2);
      fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current_weather=true')
        .then(function(r){return r.json();})
        .then(function(data){
          if(!data||!data.current_weather)return;
          var temp=Math.round(data.current_weather.temperature);
          var code=data.current_weather.weathercode;
          var icon='☀️';
          if(code>=61&&code<=67)icon='🌧️';
          else if(code>=51&&code<=57)icon='🌦️';
          else if(code>=71&&code<=77)icon='❄️';
          else if(code>=80&&code<=82)icon='🌧️';
          else if(code>=95)icon='⛈️';
          else if(code>=2&&code<=3)icon='⛅';
          else if(code===1)icon='🌤️';
          document.getElementById('top-meta').textContent=tarih+' '+saat+' '+icon+temp+'°C';
          /* Sehir adini da cek */
          fetch('https://nominatim.openstreetmap.org/reverse?lat='+lat+'&lon='+lon+'&format=json')
            .then(function(r){return r.json();})
            .then(function(geo){
              var il=geo.address.city||geo.address.town||geo.address.county||'';
              if(il)document.getElementById('top-meta').textContent=il+' '+icon+temp+'°C · '+saat;
            }).catch(function(){});
        }).catch(function(){});
    },function(){});
  }
}

/* REPORT */
var rTab='monthly';
function srt(t,b){rTab=t;document.querySelectorAll('.rtab').forEach(function(x){x.classList.remove('on');});b.classList.add('on');rr();}
function rr(){
  var now=new Date();
  var f=D.txs.filter(function(t){
    var d=new Date(t.date);
    if(rTab==='daily')return t.date===td2();
    if(rTab==='weekly')return(now-d)/86400000<=7;
    if(rTab==='monthly')return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
    return d.getFullYear()===now.getFullYear();
  });
  var incTRY=f.filter(function(t){return t.tp==='inc'&&t.cur==='TRY';}).reduce(function(s,t){return s+t.amt;},0);
  var expTRY=f.filter(function(t){return t.tp==='exp'&&t.cur==='TRY';}).reduce(function(s,t){return s+t.amt;},0);
  var netUSD=f.filter(function(t){return t.cur==='USD';}).reduce(function(s,t){return t.tp==='inc'?s+t.amt:s-t.amt;},0);
  var netEUR=f.filter(function(t){return t.cur==='EUR';}).reduce(function(s,t){return t.tp==='inc'?s+t.amt:s-t.amt;},0);
  var net=incTRY-expTRY;
  document.getElementById('ri-try').textContent='₺'+fm(incTRY);
  document.getElementById('re-try').textContent='₺'+fm(expTRY);
  var ne=document.getElementById('rn-try');ne.textContent='₺'+fm(net);ne.className='rv '+(net>=0?'inc':'exp');
  document.getElementById('rn-usd').textContent=(netUSD>=0?'+':'')+'$'+fm(Math.abs(netUSD));
  document.getElementById('rn-usd').className='rv '+(netUSD>=0?'inc':'exp');
  document.getElementById('rn-eur').textContent=(netEUR>=0?'+':'')+'€'+fm(Math.abs(netEUR));
  document.getElementById('rn-eur').className='rv '+(netEUR>=0?'inc':'exp');
  document.getElementById('rc2').textContent=f.length;
  var mx=Math.max(incTRY,expTRY,1);
  document.getElementById('br1').style.height=Math.max((incTRY/mx)*56,4)+'px';
  document.getElementById('br2').style.height=Math.max((expTRY/mx)*56,4)+'px';
  document.getElementById('bn1').textContent='₺'+fm(incTRY);
  document.getElementById('bn2').textContent='₺'+fm(expTRY);
}

/* ACTIONS */
function fillAll(){
  var cur=document.getElementById('fcur')?document.getElementById('fcur').value:'TRY';
  var b=gb(cur);
  if(b<=0){toast('Bakiye yok',true);return;}
  document.getElementById('famt').value=b.toFixed(2);
}
function stx(type){
  var amt=parseFloat(document.getElementById('famt').value);
  if(!amt||amt<=0){toast('Gecerli tutar girin',true);return;}
  var cur=document.getElementById('fcur').value;
  if(type==='exp'&&amt>gb(cur)+0.001){toast('Bakiyeden fazla girilemez',true);return;}
  var desc=document.getElementById('fdsc').value;
  var date=document.getElementById('fdt').value||td2();
  D.txs.unshift({id:uid(),tp:type==='inc'?'inc':'exp',cur:cur,amt:amt,desc:desc,date:date});
  sv2();rb();rtx();rr();cm();
  toast(type==='inc'?'Gelir eklendi':'Gider eklendi');
}
function ucp(){
  var a=parseFloat(document.getElementById('fcamt').value);
  var to=document.getElementById('fcto').value;
  var p=document.getElementById('cprev');var pv=document.getElementById('cpv');
  if(a>0){
    p.style.display='block';
    pv.textContent=(a/D.rates[to]).toFixed(4)+' '+to;
    pv.style.color=D.dark?'#60a5fa':'#1d6fa4';
  } else p.style.display='none';
}
function scv(){
  var amt=parseFloat(document.getElementById('fcamt').value);
  if(!amt||amt<=0){toast('Gecerli tutar girin',true);return;}
  var to=document.getElementById('fcto').value;
  var got=parseFloat((amt/D.rates[to]).toFixed(6));
  D.txs.unshift({id:uid(),tp:'inc',cur:to,amt:got,desc:'TRY → '+to,date:td2()});
  D.txs.unshift({id:uid(),tp:'exp',cur:'TRY',amt:amt,desc:to+' donusumu',date:td2()});
  sv2();rb();rtx();rr();cm();
  toast(fm(amt)+' TL → '+fm(got,4)+' '+to);
}
function sn(){
  var t=document.getElementById('fnt').value.trim();
  if(!t){toast('Baslik gerekli',true);return;}
  var rem=document.getElementById('fnr').value;
  D.notes.unshift({id:uid(),title:t,body:document.getElementById('fnb').value,rem:rem,created:td2()});
  sv2();rnh();rnf();cm();
  toast(rem?'Not eklendi — 🔔 '+rem:'Not eklendi');
}
function dn(i){D.notes.splice(i,1);sv2();rnh();rnf();toast('Not silindi');}
function sep(){
  D.profile.name=document.getElementById('epn').value||'';
  D.profile.email=document.getElementById('epe').value||'';
  D.profile.phone=document.getElementById('epp').value||'';
  sv2();rp();cm();toast('Profil güncellendi');
}
function scp(){
  var o=document.getElementById('cpo').value;
  var n=document.getElementById('cpn').value;
  var r=document.getElementById('cpr').value;
  if(o!==D.pin){toast('Mevcut PIN hatali',true);return;}
  if(!/^\d{4}$/.test(n)){toast('Yeni PIN 4 rakam olmali',true);return;}
  if(n!==r){toast('PINler uyusmuyor',true);return;}
  D.pin=n;sv2();cm();toast('PIN degistirildi');
}
function ha(inp){
  var f=inp.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(e){D.profile.avatar=e.target.result;sv2();rp();toast('Fotograf guncellendi');};
  rd.readAsDataURL(f);
}

/* VERİ YÖNETİMİ */
function backupData(){
  var json=JSON.stringify(D,null,2);
  var blob=new Blob([json],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='civciv-yedek-'+td2()+'.json';
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
  toast('Yedek indirildi');
}
function restoreData(inp){
  var file=inp.files[0];if(!file)return;
  var rd=new FileReader();
  rd.onload=function(e){
    try{
      var p=JSON.parse(e.target.result);
      if(!p.txs&&!p.notes){toast('Gecersiz yedek!',true);return;}
      D.pin=p.pin||'1234';D.dark=!!p.dark;
      D.profile=p.profile||D.profile;
      D.txs=p.txs||[];D.notes=p.notes||[];
      D.rates=p.rates||D.rates;D.rd=p.rd||'';
      sv2();ra();toast('Veriler geri yuklendi');
    }catch(err){toast('Dosya okunamadi',true);}
  };
  rd.readAsText(file);
}
function resetData(){
  om('confirm',{msg:'Tum islemler ve notlar silinecek. Emin misiniz?',ok:'Evet, Sifirla',okColor:'#856404',okBg:'#fff3cd',fn:'doReset'});
}
function doReset(){
  D.txs=[];D.notes=[];D.rates={USD:32.5,EUR:35.2,GBP:40.0};D.rd='';
  sv2();ra();cm();toast('Tum veriler sifirlandi');
}
function deleteAccount(){
  om('confirm',{msg:'Hesabiniz ve tum veriler silinecek! Bu islem GERI ALINAMAZ!',ok:'Evet, Sil',okColor:'#fff',okBg:'#dc2626',fn:'doDelete'});
}
function doDelete(){
  try{localStorage.removeItem(SK);}catch(e){}
  D={pin:'1234',dark:false,profile:{name:'Ad Soyad',email:'',phone:'',avatar:null},txs:[],notes:[],rates:{USD:32.5,EUR:35.2,GBP:40.0},rd:''};
  sv2();cm();ra();lock();toast('Hesap silindi');
}

/* TOAST */
var tt;
function toast(m,e){
  var el=document.getElementById('toast');
  el.textContent=m;el.style.background=e?'#dc2626':'#16a34a';
  el.style.display='block';clearTimeout(tt);
  tt=setTimeout(function(){el.style.display='none';},2500);
}

/* INIT */
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
ad();
sv('home');
document.getElementById('qbar').style.display='flex';
document.getElementById('pin-screen').style.display='flex';
topMeta();
setInterval(topMeta,60000);
</script>
</body>
